# ╩ ╩ ╩ ╩  ╩╚═╩═╝╩ ╩╝╚╝═╩╝
# Kali-Hyprland — the kali-clean look, on Wayland
# Author: KermitPurple96
#
# Colours, gaps, borders and keybindings mirror the i3 setup in
# https://github.com/KermitPurple96/kali-clean, with three things i3 could
# never do: real window animations, rounded corners and background blur.
#
# LEGACY FORMAT -- for Hyprland older than 0.51 only.
#
# Hyprland 0.51 introduced the Lua config, and 0.56 prints "You are using
# the .conf config format, support for which will be removed in Hyprland
# 0.57" when it loads this file. The maintained version of this setup is
# ../.config/hypr/hyprland.lua; this copy is kept only so the repo still
# works on an older Hyprland. Never put both in ~/.config/hypr.
#
# Written for Hyprland 0.43-0.56 (`windowrule`, `decoration:shadow {}`).

###############################################################################
# PALETTE — lifted straight out of the kali-clean i3 config
###############################################################################
# $bg       1C1D2B  i3bar background
# $bgAlt    282A3E  focused workspace / module background
# $fg       E6FFF5  statusline foreground
# $accent   82c8ff  client.focused border
# $inactive 333333  client.unfocused border
# $urgent   900000  client.urgent
# $vpn      3BB92D  i3blocks tun0 indicator

$accent      = rgba(82c8ffff)
$accentSoft  = rgba(82c8ff55)
$inactiveCol = rgba(333333ff)
$shadowCol   = rgba(1a1a1aee)

###############################################################################
# MONITORS
###############################################################################
monitor = , preferred, auto, 1

###############################################################################
# AUTOSTART
###############################################################################
# Wallpaper — the Wayland stand-in for kali-clean's ~/.fehbg (feh)
exec-once = ~/.config/hypr/scripts/wallpaper.sh

# Bar, notifications, tray applets
exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator

# Polkit agent — whichever one this box actually shipped
exec-once = ~/.config/hypr/scripts/polkit-agent.sh

# VMware guest tools: kali-clean's clipboard_fix.sh, unchanged
exec-once = ~/.config/i3/clipboard_fix.sh

# Hand the session environment to systemd/dbus so portals and tray work
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

###############################################################################
# ENVIRONMENT
###############################################################################
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

###############################################################################
# PROGRAMS
###############################################################################
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun

###############################################################################
# INPUT
###############################################################################
input {
    # This box is a Spanish layout. Change to `us` (or whatever you use) if
    # you are not; it is the only line in this file that is machine-specific.
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###############################################################################
# GENERAL — kali-clean's gaps and border colours
###############################################################################
general {
    # i3: `gaps inner 2` / `gaps outer 4`
    gaps_in  = 2
    gaps_out = 4

    # i3: `for_window [class="^.*"] border pixel 2`
    border_size = 3

    # i3: client.focused #82c8ff / client.unfocused #333333
    col.active_border   = $accent
    col.inactive_border = $inactiveCol

    layout = dwindle

    resize_on_border = true
    allow_tearing    = false
}

###############################################################################
# DECORATION — rounded corners, blur and shadows (the part i3 never had)
###############################################################################
decoration {
    rounding       = 10
    rounding_power = 2.0

    # Leave these at 1.0 — per-window transparency is set by the app itself
    # (kitty's background_opacity) so that blur has real alpha to work behind.
    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled            = true
        size               = 8
        passes             = 3
        new_optimizations  = true
        xray               = false
        ignore_opacity     = true
        popups             = true
        popups_ignorealpha = 0.2
        noise              = 0.0117
        contrast           = 1.0
        brightness         = 1.0
        vibrancy           = 0.1696
        vibrancy_darkness  = 0.0
    }

    # 0.43+ moved these out of `decoration` and into their own block.
    shadow {
        enabled      = true
        range        = 14
        render_power = 3
        color        = $shadowCol
        offset       = 0 0
    }

    dim_inactive = false
    dim_strength = 0.05
}

###############################################################################
# ANIMATIONS
###############################################################################
animations {
    enabled = true

    bezier = wind,      0.05, 0.9,  0.1,  1.05
    bezier = overshot,  0.13, 0.99, 0.29, 1.10
    bezier = smoothOut, 0.36, 0.00, 0.66, -0.56
    bezier = smoothIn,  0.25, 1.00, 0.50, 1.00

    animation = windows,     1, 5, overshot,  popin 80%
    animation = windowsIn,   1, 5, overshot,  popin 80%
    animation = windowsOut,  1, 4, smoothOut, popin 80%
    animation = windowsMove, 1, 4, wind,      slide
    animation = border,      1, 10, default
    animation = fade,          1, 7, smoothIn
    animation = fadeIn,        1, 7, smoothIn
    animation = fadeOut,       1, 5, smoothOut
    animation = fadeSwitch,    1, 7, smoothIn
    animation = fadeDim,       1, 7, smoothIn
    animation = layers,        1, 5, overshot,  slide
    animation = layersIn,      1, 5, overshot,  slide
    animation = layersOut,     1, 4, smoothOut, slide
    animation = fadeLayersIn,  1, 7, smoothIn
    animation = fadeLayersOut, 1, 5, smoothOut
    animation = workspaces,  1, 5, overshot,  slidevert
}

###############################################################################
# LAYOUTS
###############################################################################
dwindle {
    pseudotile     = true
    preserve_split = true
    smart_split    = false
}

master {
    new_status = master
}

###############################################################################
# GROUPS — Hyprland's answer to i3's stacking/tabbed layouts (SUPER+S / SUPER+W)
###############################################################################
group {
    col.border_active   = $accent
    col.border_inactive = $inactiveCol

    groupbar {
        enabled      = true
        font_family  = RobotoMono Nerd Font
        font_size    = 10
        height       = 16
        gradients    = false
        render_titles = true
        col.active   = rgba(282A3Eff)
        col.inactive = rgba(1C1D2Bff)
    }
}

###############################################################################
# MISC
###############################################################################
misc {
    force_default_wallpaper   = 0
    disable_hyprland_logo     = true
    disable_splash_rendering  = true
    mouse_move_enables_dpms   = true
    key_press_enables_dpms    = true
    vrr                       = 0
    focus_on_activate         = true
}

gestures {
    workspace_swipe = false
}

###############################################################################
# WINDOW RULES
###############################################################################
windowrule = suppressevent maximize, class:.*

# Don't set an opacity rule for kitty: kitty draws itself at
# `background_opacity 0.83`, and stacking a second opacity on top of that
# would double-dim it. Hyprland blurs whatever alpha the app provides.

# Alacritty has no equivalent knob in kali-clean's alacritty.yml, so it gets
# its 85% here — the same value compton used in the i3 setup.
windowrule = opacity 0.85 0.85, class:^(Alacritty)$

# Float the dialogs i3 would have floated anyway
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin,   title:^(Picture-in-Picture)$

# Fix XWayland apps that come up misdrawn on a VM
windowrule = noblur, xwayland:1, class:^(flameshot)$

###############################################################################
# LAYER RULES — blur behind the bar, the launcher and notifications
###############################################################################
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, notifications
layerrule = ignorezero, notifications

###############################################################################
# KEYBINDINGS — one-for-one with kali-clean's i3 config
###############################################################################
$mainMod = SUPER

# --- Launching / killing -----------------------------------------------------
# i3: bindsym $mod+Return exec alacritty  (kitty here, for the blur)
bind = $mainMod, Return, exec, $terminal
# i3: bindsym $mod+Shift+q kill
bind = $mainMod SHIFT, Q, killactive,
# i3: bindsym $mod+d exec "rofi -show run"
bind = $mainMod, D, exec, $menu
# Extra: file manager
bind = $mainMod SHIFT, Return, exec, $fileManager

# --- Focus -------------------------------------------------------------------
# i3 uses the shifted-by-one vim row: j=left  k=down  l=up  semicolon=right.
# `ntilde` is bound alongside `semicolon` because on a Spanish layout that is
# the physical key sitting where a US keyboard puts `;`.
bind = $mainMod, J,         movefocus, l
bind = $mainMod, K,         movefocus, d
bind = $mainMod, L,         movefocus, u
bind = $mainMod, semicolon, movefocus, r
bind = $mainMod, ntilde,    movefocus, r

bind = $mainMod, left,  movefocus, l
bind = $mainMod, down,  movefocus, d
bind = $mainMod, up,    movefocus, u
bind = $mainMod, right, movefocus, r

# --- Moving windows ----------------------------------------------------------
bind = $mainMod SHIFT, J,         movewindow, l
bind = $mainMod SHIFT, K,         movewindow, d
bind = $mainMod SHIFT, L,         movewindow, u
bind = $mainMod SHIFT, semicolon, movewindow, r
bind = $mainMod SHIFT, ntilde,    movewindow, r

bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# --- Splits and layout -------------------------------------------------------
# i3: $mod+h split h / $mod+v split v — dwindle's `preselect` is the same idea:
# it decides where the *next* window lands.
bind = $mainMod, H, layoutmsg, preselect r
bind = $mainMod, V, layoutmsg, preselect d
# i3: $mod+e layout toggle split
bind = $mainMod, E, layoutmsg, togglesplit

# i3: $mod+s layout stacking / $mod+w layout tabbed. Hyprland has one
# primitive for both — groups — so both keys toggle it, and Tab walks the group.
bind = $mainMod, S, togglegroup,
bind = $mainMod, W, togglegroup,
bind = $mainMod, Tab,        changegroupactive, f
bind = $mainMod SHIFT, Tab,  changegroupactive, b

# i3: $mod+f fullscreen toggle
bind = $mainMod, F, fullscreen, 0

# i3: $mod+Shift+space floating toggle / $mod+space focus mode_toggle
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod, space, cyclenext, floating

# Extra dwindle niceties
bind = $mainMod, P, pseudo,
bind = $mainMod, C, centerwindow,

# --- Workspaces --------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# --- Session -----------------------------------------------------------------
# i3: $mod+Shift+c reload / $mod+Shift+r restart — both reload here, since
# Hyprland re-reads its config in place and has no separate restart.
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload
# i3: $mod+Shift+e exit (i3-nagbar) — wofi stands in for the nagbar
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/exit.sh

# --- Screenshot --------------------------------------------------------------
# i3: bindsym $mod+P exec flameshot gui  →  grim + slurp, copied and saved
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/screenshot.sh

# --- Mouse -------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Media / volume keys (no i3 equivalent, but free) ------------------------
bindel = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl  = , XF86AudioMute,         exec, pactl set-sink-mute   @DEFAULT_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

###############################################################################
# RESIZE MODE — i3's `mode "resize"`, entered with SUPER+R
###############################################################################
bind = $mainMod, R, submap, resize
submap = resize

# i3: j shrink width / k grow height / l shrink height / semicolon grow width
binde = , J,         resizeactive, -20 0
binde = , K,         resizeactive, 0 20
binde = , L,         resizeactive, 0 -20
binde = , semicolon, resizeactive, 20 0
binde = , ntilde,    resizeactive, 20 0

# i3: Left shrink width / Down grow height / Up shrink height / Right grow width
binde = , left,  resizeactive, -20 0
binde = , down,  resizeactive, 0 20
binde = , up,    resizeactive, 0 -20
binde = , right, resizeactive, 20 0

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset

# i3's direct resize bindings, outside the mode
binde = $mainMod CTRL SHIFT, right, resizeactive, -20 0
binde = $mainMod CTRL SHIFT, up,    resizeactive, 0 20
binde = $mainMod CTRL SHIFT, down,  resizeactive, 0 -20
binde = $mainMod CTRL SHIFT, left,  resizeactive, 20 0
