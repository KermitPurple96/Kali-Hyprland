# Kitty for Kali-Hyprland.
#
# Rounded corners and the blur behind this window are Hyprland's doing
# (decoration:rounding + decoration:blur in ~/.config/hypr/hyprland.lua).
# Kitty's job is to hand the compositor a translucent surface to blur:
# that is `background_opacity` below. Do NOT also set a windowrule opacity
# for kitty in the Hyprland config — the two multiply and the terminal goes
# murky.
#
# `background_blur` is NOT macOS-only any more, and it does work here.
# kitty's own docs say it takes effect "on macOS and Wayland, when the
# compositor supports the background blur extension". That extension is
# ext-background-effect-v1, and Hyprland 0.56 implements it:
#
#   $ strings /usr/bin/Hyprland | grep ext_background
#   ext_background_effect_manager_v1
#   ext_background_effect_surface_v1
#
# So kitty asks for the blur itself rather than relying purely on the
# compositor blurring every window by default. Two notes on that:
#
#   * the integer is a blur RADIUS only on macOS. On Wayland it is a
#     flag -- any positive value means "yes, blur behind me" -- so 1 is
#     the honest value to write here, and a larger number buys nothing.
#   * this does not stack with decoration:blur into a double blur. It is
#     a request for the region behind this surface, which the compositor
#     already blurs; the radius stays whatever decoration:blur:size says.
#
# If you ever run this config under a compositor without the extension,
# the line is simply ignored and Hyprland-style compositor blur (or none)
# is what you get. It is never an error.

enable_audio_bell no

# kitty has no `window_padding_height` -- it was being silently ignored.
# window_padding_width takes 1/2/3/4 values; two means "vertical horizontal".
window_padding_width 10 12

font_family      Hack Nerd Font
font_size 10

#exe_search_path +/usr/bin/
exe_search_path /usr/bin /usr/local/bin

cursor #00FF00

disable_ligatures never

url_color #fff
url_style curly

cursor_shape beam
cursor_beam_thickness 1.2

allow_remote_control yes
listen_on unix:/tmp/mini_kitty_scrollback_nvim
shell_integration enabled

# kitty-scrollback.nvim Kitten alias$
action_alias kitty_scrollback_nvim kitten /home/kermit/kitty.app/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim$
map ctrl+shift+n kitty_scrollback_nvim
# Browse output of the last shell command in nvim$
#map ctrl+ñ kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim$
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Example kitty-scrollback.nvim nvim overrides$
#map f1 kitty_scrollback_nvim --no-nvim-args --env NVIM_APPNAME=ksb-nvim
#map f1 kitty_scrollback_nvim --nvim-args +'colorscheme tokyonight'
#map f1 kitty_scrollback_nvim --nvim-args +'lua vim.defer_fn(function() vim.api.nvim_set_option_value("filetype", "markdown", { buf = 0 }); vim.cmd("silent! CellularAutomaton make_it_rain") end, 6000)'

map ctrl+shift+enter launch --cwd=current
map ctrl+shift+o next_tab
map ctrl+shift+j previous_tab
map shift+cmd+t set_tab_title

map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+ñ launch --type=overlay --stdin-source=@screen_scrollback /bin/sh -c "/usr/local/bin/fzf --no-sort --no-mouse --exact -i --tac | kitty +kitten clipboard"
map ctrl+shift+z toggle_layout stack
tab_bar_style powerline

inactive_tab_background #1C1D2B
inactive_tab_foreground #888888
active_tab_background #82c8ff
active_tab_foreground #1C1D2B

map ctrl+j neighboring_window left
map ctrl+o neighboring_window right
map ctrl+i neighboring_window up
map ctrl+k neighboring_window down

# --- transparency: this is what gets blurred behind ---
# Pure black, heavily translucent. background_opacity must be < 1 or there
# is nothing to see through and background_blur is ignored entirely.
#
# 0.55 is a long way open. Two things keep the text readable at that alpha:
# the ground is #000000, so whatever shows through is darkened rather than
# tinted, and Hyprland's blur (radius 5 in the `soft` profile) removes the
# high-frequency detail of the wallpaper underneath -- and the wallpaper
# here is a busy, fiery painting, which is exactly the case where an
# unblurred translucent terminal becomes unreadable.
#
# If it is still too much, raise this rather than turning blur off: 0.65
# is noticeably safer over bright wallpaper and still clearly see-through.
background               #000000
background_opacity       0.55
dynamic_background_opacity yes

# Ask the compositor to blur what is behind this window (see header).
background_blur          1

# Hyprland draws the frame; kitty should not draw one of its own.
hide_window_decorations  yes
confirm_os_window_close  0


shell fish
