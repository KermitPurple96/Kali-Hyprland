# Kitty for Kali-Hyprland.
#
# This is the kitty.conf from https://github.com/KermitPurple96/i3-kitty,
# carried over to Wayland. Everything that was working there is unchanged:
# the kitty-scrollback.nvim integration, the f1-f4 copy buffers, the
# ctrl+j/o/i/k window navigation that matches the i3 focus keys, and the
# #43a047 green tab bar.
#
# What changed, and why, is marked with "CHANGED:" below.

enable_audio_bell no

# CHANGED: `window_padding_height` is not a kitty option -- it was being
# silently ignored ("Ignoring unknown config key"). window_padding_width
# takes 1/2/3/4 values; two means "vertical horizontal".
window_padding_width 0 0

font_family      Hack Nerd Font
font_size 10

cursor #00FF00

disable_ligatures never

url_color #fff
url_style curly

cursor_shape beam
cursor_beam_thickness 1.2

allow_remote_control yes
listen_on unix:/tmp/mini_kitty_scrollback_nvim
shell_integration enabled

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /home/kermit/kitty.app/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map ctrl+shift+n kitty_scrollback_nvim
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# ---------------------------------------------------------------- TABS ----
# CHANGED: this is the "I can't see my tabs" fix, and it is two separate
# problems.
#
# 1. THE TAB BAR WAS HIDDEN. kitty hides the tab bar until there are at
#    least `tab_bar_min_tabs` tabs, and that defaults to 2. With a single
#    tab open there is nothing to see, however the bar is styled. Setting
#    it to 1 means the bar is always on screen.
#
# 2. SUPER+SHIFT+T NEVER EXISTED. The old line was
#        map shift+cmd+t set_tab_title
#    and `cmd` is the macOS Command key -- kitty only recognises it on
#    macOS, so on Linux that binding silently did nothing. It was also
#    bound to set_tab_title (rename), not new_tab (create).
#
# So: super+shift+t now opens a tab, which is what the key was reaching
# for, and renaming moves to its own binding.
tab_bar_min_tabs     1
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_edge         top
# Show the index so super+1..9-style muscle memory has something to read.
tab_title_template   "{index}: {title}"

map super+shift+t new_tab
map ctrl+shift+t  new_tab
map super+shift+r set_tab_title
map ctrl+shift+q  close_tab

# Their originals, kept: next/previous tab
map ctrl+shift+o next_tab
map ctrl+shift+j previous_tab

# Jump straight to a tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

map ctrl+shift+enter launch --cwd=current

map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+ñ launch --type=overlay --stdin-source=@screen_scrollback /bin/sh -c "/usr/local/bin/fzf --no-sort --no-mouse --exact -i --tac | kitty +kitten clipboard"
map ctrl+shift+z toggle_layout stack

# Tab colours from i3-kitty: the #43a047 green.
inactive_tab_background #2c2c2c
inactive_tab_foreground #43a047
active_tab_background   #43a047
active_tab_foreground   #2c2c2c

# Window navigation matching the i3/Hyprland focus keys (j/k/i/o)
map ctrl+j neighboring_window left
map ctrl+o neighboring_window right
map ctrl+i neighboring_window up
map ctrl+k neighboring_window down

# --------------------------------------------------- TRANSPARENCY / BLUR ---
# Pure black, heavily translucent. background_opacity must be < 1 or there
# is nothing to see through and background_blur is ignored entirely.
#
# CHANGED from 0.83 to 0.55 (much more translucent) and the ground from the
# kitty default to #000000, so what shows through is darkened rather than
# tinted.
#
# `background_blur` is NOT macOS-only, despite how it is usually described.
# kitty's own docs say it takes effect "on macOS and Wayland, when the
# compositor supports the background blur extension" -- that extension is
# ext-background-effect-v1, and Hyprland 0.56 implements it:
#
#   $ strings /usr/bin/Hyprland | grep ext_background
#   ext_background_effect_manager_v1
#   ext_background_effect_surface_v1
#
# On Wayland the integer is a flag, not a radius (that is a macOS thing),
# so 1 is the honest value. It does not stack with Hyprland's own
# decoration:blur into a double blur.
#
# If text is hard to read over the wallpaper, raise this to 0.65 rather
# than turning blur off.
background               #000000
background_opacity       0.55
dynamic_background_opacity yes
background_blur          1

# Hyprland draws the frame; kitty should not draw one of its own.
hide_window_decorations  yes
confirm_os_window_close  0

# CHANGED: removed `exec --no-startup-id compton -b -f`. That is an i3
# config line that had been pasted into kitty.conf -- kitty does not have
# an `exec` directive and was logging it as an unknown key on every start.
# compton is an X11 compositor and does nothing under Wayland anyway;
# Hyprland does the compositing here.

shell fish
