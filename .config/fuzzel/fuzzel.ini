# Fuzzel -- the launcher for Kali-Hyprland.
#
# WHY NOT WOFI. wofi is a GTK application: on every keystroke it re-runs the
# match over all ~345 .desktop entries, rebuilds a GTK widget tree and asks
# the compositor to repaint the whole layer surface. With no GPU, that repaint
# goes through llvmpipe on the CPU -- and if the layer is also blurred, the
# blur is recomputed each time too. The result is a launcher that stutters
# and drops keystrokes as you type.
#
# fuzzel is a native Wayland client that draws with a simple software
# renderer, keeps the desktop-entry index in memory, and repaints only the
# lines that changed. It is the single biggest fix for "SUPER+D is laggy".
#
# COLOURS are the everforest palette from i3-kitty's rofi/config.rasi, so
# the launcher looks the same as it did under i3:
#   bg0 #2B3339   bg1 #323D43   fg0 #D3C6AA
#   accent #A7C080   urgent #DBBC7F
# fuzzel takes RRGGBBAA, hence the trailing alpha byte on each.

[main]
font=Hack Nerd Font:size=12
# rofi config.rasi: window { width: 480; }  listview { lines: 8; }
width=45
lines=8
horizontal-pad=8
vertical-pad=8
inner-pad=8
line-height=20
# Terminal used for entries with Terminal=true
terminal=kitty -e
layer=overlay
# Show the launcher instantly rather than waiting for a frame callback.
prompt=" "
icons-enabled=no
# Matching: fuzzy is what rofi did (rofi.fuzzy: true). fuzzel's fuzzy match
# is C, over a prebuilt index, so it stays fast where wofi's did not.
match-mode=fzf

[colors]
background=2B3339f2
text=D3C6AAff
prompt=A7C080ff
placeholder=D3C6AA80
input=D3C6AAff
match=A7C080ff
selection=A7C080ff
selection-text=2B3339ff
selection-match=2B3339ff
border=A7C080ff

[border]
width=1
radius=0

[dmenu]
exit-immediately-if-empty=yes
